api:
  anthropic:
    model: "claude-3-5-sonnet-20240620"
    max_retries: 3
    base_delay: 4
    max_delay: 60
    concurrent_limit: 3
    batch_size: 5
    pricing:
      base_input: 3.00
      cache_write: 3.75
      cache_read: 1.50
      output: 15.00

  cohere:
    model: "embed-english-v3.0"
    max_retries: 3
    base_delay: 4
    max_delay: 60

paths:
  input:
    product_data: "/Users/aswinsreenivas/Projects/D2C Search Engine/uplyft_server/uplyft-shopify-scraper/data/02_intermediate/processed_dataframe.csv"
    images_dir: "/Users/aswinsreenivas/Projects/D2C Search Engine/uplyft_server/uplyft-shopify-scraper/data/02_intermediate/suta/images"
  
  output:
    base_dir: "/Users/aswinsreenivas/Projects/D2C Search Engine/uplyft_server/product_attributes/output"
    structure:
      attributes: "{product_type}/attributes"
      images: "{product_type}/images"
    logs_dir: "logs"

prompts:
  dir: "config/prompts"
  system_temperature: 0.1
  max_tokens: 4096

attributes:
  brand:
    required: true
    data_type: string
    item_type: string
    default: "suta"
    in_search_context: false

  brand_title:
    required: true
    data_type: string
    item_type: string
    in_search_context: false

  title:
    required: true
    data_type: string
    item_type: string
    in_search_context: true

  description:
    required: true
    data_type: string
    item_type: string
    in_search_context: true

  price:
    required: true
    data_type: float
    item_type: float
    min: 0
    in_search_context: false

  primary_color:
    required: true
    data_type: string
    item_type: enum
    allowed_values: Color
    threshold: 1
    in_search_context: true

  primary_color_hex:
    required: true
    data_type: string
    item_type: string
    pattern: "^#([A-Fa-f0-9]{6})$"
    in_search_context: false

  primary_color_detailed:
    required: true
    data_type: string
    item_type: enum
    allowed_values: ColorDetailed
    threshold: 0.8
    in_search_context: true

  secondary_colors:
    required: true
    data_type: list
    item_type: enum
    allowed_values: Color
    max_length: 3
    threshold: 0.8
    in_search_context: true
  
  secondary_color_hex:
    required: true
    data_type: list
    item_type: string
    max_length: 3
    pattern: "^#([A-Fa-f0-9]{6})$"
    in_search_context: false
  
  secondary_colors_detailed_hex:
    required: true
    data_type: list
    item_type: string
    pattern: "^#([A-Fa-f0-9]{6})$"
    max_length: 3
    in_search_context: false

  secondary_colors_detailed:
    required: true
    data_type: list
    item_type: enum
    allowed_values: ColorDetailed
    max_length: 3
    threshold: 0.8
    in_search_context: true

  pattern:
    required: true
    data_type: list
    item_type: enum
    allowed_values: Pattern
    max_length: 3
    threshold: 0.8
    in_search_context: true

  material:
    required: true
    data_type: string
    item_type: enum
    allowed_values: Material
    threshold: 0.8
    in_search_context: true

  embellishment:
    required: true
    data_type: list
    item_type: enum
    allowed_values: Embellishment
    max_length: 5
    threshold: 0.8
    in_search_context: true

  embellishment_level:
    required: true
    data_type: string
    item_type: enum
    allowed_values: EmbellishmentLevel
    threshold: 0.8
    in_search_context: true

  embellishment_detailed:
    required: true
    data_type: list
    item_type: string
    max_length: 5
    in_search_context: true

  occasions:
    required: true
    data_type: list
    item_type: enum
    allowed_values: Occasion
    max_length: 3
    threshold: 0.8
    in_search_context: true

  occasions_detailed:
    required: true
    data_type: list
    item_type: string
    max_length: 5
    in_search_context: true

  style:
    required: true
    data_type: list
    item_type: enum
    allowed_values: Style
    max_length: 3
    threshold: 0.8
    in_search_context: true

  care_instructions:
    required: true
    data_type: string
    item_type: string
    in_search_context: true

  size:
    required: true
    data_type: list
    item_type: string
    in_search_context: false

  unique_design_element:
    required: true
    data_type: list
    item_type: string
    min_length: 1
    max_length: 3
    in_search_context: true

  gender:
    required: true
    data_type: list
    item_type: enum
    allowed_values: Gender
    default: [FEMALE]
    threshold: 1.0
    in_search_context: false

  age_group:
    required: true
    data_type: list
    item_type: enum
    allowed_values: AgeGroup
    default: [ADULT]
    threshold: 1.0
    in_search_context: false

  coordinating_items:
    required: true
    data_type: object
    item_type: object
    properties:
      clothing:
        data_type: list
        item_type: string
        max_length: 5
      accessories:
        data_type: list
        item_type: string
        max_length: 5
      footwear:
        data_type: list
        item_type: string
        max_length: 5
      additional_apparel:
        data_type: list
        item_type: string
        max_length: 3
      styling_suggestions:
        data_type: list
        item_type: string
        max_length: 3
    in_search_context: true

  product_image_link:
    required: true
    data_type: list
    item_type: string
    in_search_context: false

  product_url:
    required: true
    data_type: list
    item_type: string
    in_search_context: false

  search_context:
    required: true
    data_type: string
    item_type: string
    in_search_context: false

  text_embedding:
    required: true
    data_type: list
    item_type: float
    in_search_context: false

  image_embedding:
    required: true
    data_type: list
    item_type: float
    in_search_context: false

# Validation
validation_errors:
  required: false
  data_type: list
  item_type: string
  in_search_context: false 

logging:
  level: INFO
  format: "%(asctime)s - %(levelname)s - [%(name)s:%(lineno)d] - %(message)s"
  handlers:
    - type: file
      filename: "processing_{timestamp}.log"
    - type: stream

caching:
  backend: redis
  host: localhost
  port: 6379
  db: 0
  prefix: "prod_attr:"

# Keep the old format for backward compatibility
search_context:
  include_base_attributes:
    - title
    - description
    - price
    - primary_color
    - primary_color_detailed
    - secondary_colors
    - secondary_colors_detailed
    - pattern
    - material
    - embellishment
    - embellishment_level
    - embellishment_detailed
    - occasions
    - occasion_detailed
    - style
    - care_instructions
    - size
    - unique_design_element
    - gender
    - age_group
    - coordinating_items
  
  format_rules:
    list_attributes:
      join_with: ", "
    enum_attributes:
      use_value: true
    boolean_attributes:
      true_format: "{attr_name}: Yes"
      false_format: null
    coordinating_items:
      format: "{category}: {items}"
      items_join: ", "
      categories_join: "; "

category_standardization:
  patterns:
    - name: "Saree"
      matches: 
        - 'saree'
        - 'sari'
        - 'garage_saree'
        - 'saree with blouse piece'
        - 'reversible saree'
        - 'ready to wear'
    - name: "Blouse"
      matches: 
        - 'blouse'
        - 'garage_blouse'
    - name: "Kurta"
      matches:
        - 'kurta set'
        - 'kurta'
    - name: "Lehenga"
      matches:
        - 'lehenga set'
        - 'lehengas'
        - 'semi stitched lehenga set'
        - 'skirt, blouse and dupatta'
    - name: "Dupatta"
      matches:
        - 'dupatta'
        - 'stole'
        - 'shawl'
    - name: "Underskirt"
      matches:
        - 'underskirt'
        - 'petticoat'
    - name: "Co-ord Set"
      matches:
        - 'co-ord set'
        - 'co-ord'
    - name: "Combo Sets"
      matches: 
        - 'combo of \d+'
        - 'combo'
    - name: "Dress"
      matches:
        - 'dress'
        - 'pantsuit set'
        - 'lounge wear'
    - name: "Accessories"
      matches:
        - 'accessories'
        - 'earrings'
        - 'scarf'
        - 'neckpiece'
        - 'scrunchies'
    - name: "Fabric"
      matches:
        - 'fabric'
        - 'swaddle'
        - 'curtains'
        - 'bed linen'
    - name: "Shirt"
      matches:
        - 'shirt'
        - 'shirts & tops'
    - name: "Trouser"
      matches:
        - 'trouser'
        - 'pants'
        - 'dhoti'
    - name: "Jacket"
      matches:
        - 'jacket'
        - 'long jacket'
        - 'short jacket'
        - 'overcoat'
    - name: "Home Textiles"
      matches:
        - 'quilts & comforters'
        - 'bunting'
        - 'table runner'
    - name: "Gift Items"
      matches:
        - 'gift'
        - 'gift box'
        - 'gift wrapping'
        - 'gift cards'
    - name: "Rakhi"
      matches:
        - 'rakhi'
        - 'lumba rakhi'
  default_strategy: "title_case" 